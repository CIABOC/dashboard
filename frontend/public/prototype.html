<label class="top-check"><input type="checkbox" data-a="cmp" ${st.cmp?'checked':''}> Compare to previous</label>`}
<select data-a="lang" aria-label="Language"><option value="en" ${st.lang=='en'?'selected':''}>English</option><option value="si" ${st.lang=='si'?'selected':''}>සිංහල</option><option value="ta" ${st.lang=='ta'?'selected':''}>தமிழ்</option></select>
${isVmr?'':`<button class="top-button" data-a="bell" aria-label="Notifications" aria-expanded="${st.nt}">${dashboardIcon('alerts')}<span class="bdg">${nbad()}</span></button><button class="top-button top-profile" data-a="prof" aria-label="Profile and roles" aria-expanded="${st.pm}">AS ${dashboardIcon('down')}</button>`}
</div>
${st.nt?`<div class="pop"><h4>Notifications</h4>${A.filter(a=>a.st=='New').map(a=>`<button data-a="alert" data-k="${a.id}">${chip(a.sev,sevC[a.sev])} ${a.t}<small>${a.dept} · ${a.cr}</small></button>`).join('')||'<div class="empty">You’re up to date. New alerts appear here.</div>'}<button data-a="go" data-k="alerts"><b>View all alerts</b></button></div>`:''}
${st.pm?`<div class="pop"><h4>${ROLES[st.role]}</h4><small style="margin:0 8px 6px">Demo: switch role to preview role-aware access</small>${Object.keys(ROLES).map(r=>`<button data-a="role" data-k="${r}">${r==st.role?'✓ ':''}${ROLES[r]}</button>`).join('')}<hr><button data-a="acct">Account settings</button><button data-a="logout">Log out</button></div>`:''}
</header>
<main class="pg1${isVmr?' vmr-workspace':' dashboard-workspace'}">${page()}</main></div>${st.md?modal():''}${st.dr?drawer():''}`}
function modal(){const{k,v}=st.md,n=parseFloat(String(v).replace(/,/g,'')),pc=/%/.test(v),R=[['Investigation',.32],['Preliminary examination',.24],['Legal & prosecution support',.18],['Declarations & verification',.14],['Regional offices',.12]];
return `<div class="ov" data-a="close"><div class="md" data-a="stay" role="dialog" aria-label="Breakdown"><h3>${k}</h3><p class="sub">Approved aggregate breakdown · total ${v} · de-identified</p>${prog(R.map(([n2,r])=>({n:n2,v:pc?+(n+(r-.2)*20).toFixed(1):Math.round(n*r),m:pc?100:n*.4})),'Division',pc?'%':'')}<div class="note">Case-level and personal records are restricted. Request elevated access through your Director.</div><button class="btn" data-a="close">Close</button></div></div>`}
function drawer(){const d=st.dr;if(d.t=='a'){const a=A.find(x=>x.id==d.id);return `<div class="dr" role="dialog"><button class="btn o s" data-a="close" style="float:right">Close</button><h3>${a.id}</h3><p>${a.t}</p><p>${chip(a.sev,sevC[a.sev])} ${chip(a.st,'in')} ${chip('Escalation: '+a.esc)}</p><p class="sub">${a.cat} · ${a.dept} · Created ${a.cr}<br>Owner: ${a.own}</p><b>Action timeline</b><div class="tl">${a.log.map(l=>`<div>● ${l}</div>`).join('')}</div>${a.ev?`<p><b>Closure evidence:</b> ${a.ev}</p>`:''}
${a.st!='Resolved'?`<div class="fl"><button class="btn s" data-a="ack" data-k="${a.id}" ${a.st!='New'?'disabled':''}>Acknowledge</button><select id="own"><option>Director, Preliminary Examination</option><option>Director, Finance</option><option>Director, Planning</option><option>Data administrator</option></select><button class="btn s o" data-a="asg" data-k="${a.id}">Assign</button><button class="btn s o" data-a="esc" data-k="${a.id}" ${a.esc!='None'?'disabled':''}>Escalate to DG</button></div><label class="sub">Closure evidence (required to resolve)</label><input id="ev" class="srch" style="width:100%;margin:4px 0 8px" placeholder="e.g. Reconciliation report ref"><button class="btn" data-a="res" data-k="${a.id}">Mark resolved</button>`:''}</div>`}
const s=SYS.find(x=>x[0]==d.id);return `<div class="dr" role="dialog"><button class="btn o s" data-a="close" style="float:right">Close</button><h3>${s[0]} · ${s[1]}</h3><p>${st2(s[2])}</p><p>Last successful sync: ${s[3]}<br>Data freshness: ${s[4]}<br>Failed attempts (7 d): ${s[5]}<br>Source availability: ${s[6]}%</p>${s[2]!='Healthy'?`<div class="note e">Figures from this source are delayed. Dashboards show a “Delayed” label until the next successful sync.</div>`:''}<button class="btn" data-a="sync" data-k="${s[0]}">Sync now</button></div>`}
function login(){return `<div class="ct"><div class="lc"><div class="logo" style="width:52px;height:52px;font-size:24px">C</div><h2>CIABOC Management Intelligence</h2><p class="sub">Commission to Investigate Allegations of Bribery or Corruption · Sri Lanka</p><button class="btn" data-a="go" data-k="overview">Sign in with CIABOC Account</button><p class="sub" style="margin-top:12px">Single sign-on with multi-factor authentication. Access is limited to authorized officers and every session is logged.</p><p><a href="#" data-a="forgot">Forgot password?</a></p><div class="note">Prototype with fictional sample data. Figures do not represent actual CIABOC statistics.</div></div></div>`}
function render(){
  const app=document.getElementById('app');
  const lastNav=app.querySelector('.nav');
  const scroll=lastNav?.scrollTop??0;
  const active=document.activeElement;
  const sideButton=active?.closest('.side button');
  const closeScrim=active?.matches('.nav-scrim');
  app.classList.toggle('with-sidebar',st.screen!=='login');
  app.innerHTML=st.screen==='login'?login():shell();
  const nav=app.querySelector('.nav');
  if(nav)nav.scrollTop=scroll;
  if(active===lastNav&&nav)nav.focus({preventScroll:true});
  if(sideButton||closeScrim){
    const buttons=[...app.querySelectorAll('.side button')];
    const target=closeScrim?buttons.find(button=>button.dataset.a==='tsb'):buttons.find(button=>
      button.dataset.a===sideButton.dataset.a&&button.dataset.k===sideButton.dataset.k);
    target?.focus({preventScroll:true});
  }
  const livePanel=document.getElementById('vmr-live');
  if(livePanel)vmrLive.mount(livePanel,{months:st.n,compare:st.cmp});
  else vmrLive.unmount();
}
compactNav.addEventListener('change',({matches})=>{
  st.sc=matches;
  if(st.screen!=='login')render();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&compactNav.matches&&!st.sc&&st.screen!=='login'&&!document.querySelector('dialog[open]')){
    st.sc=true;
    render();
  }
});
window.addEventListener('message',event=>{
  if(window.parent===window||event.source!==window.parent||event.origin!==location.origin)return;
  if(event.data?.type==='ciaboc:vmr-api'&&vmrLive.connect(event.data.apiBase)&&st.screen==='vmr')render();
});
if(window.parent!==window)window.parent.postMessage({type:'ciaboc:vmr-ready'},location.origin);
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
const now=()=>'22 Nov 2026, '+new Date().toTimeString().slice(0,5),al=id=>A.find(a=>a.id==id);
function act(a,k,i){const A1=al(k);switch(a){
case'go':st.screen=k;if(compactNav.matches)st.sc=true;st.load=true;st.nt=st.pm=false;st.dr=st.md=null;render();setTimeout(()=>{st.load=false;render()},350);return;
case'tsb':st.sc=!st.sc;break;case'bell':st.nt=!st.nt;st.pm=false;break;case'prof':st.pm=!st.pm;st.nt=false;break;
case'drill':st.md={k:k,v:event.target.closest('[data-v]').dataset.v};break;case'close':st.md=st.dr=null;break;
case'alert':st.dr={t:'a',id:k};st.nt=false;break;case'sys':st.dr={t:'s',id:k};break;
case'ack':A1.st='Acknowledged';A1.log.push('Acknowledged '+now());toast(k+' acknowledged');break;
case'asg':A1.own=document.getElementById('own').value;A1.st='Assigned';A1.log.push('Assigned to '+A1.own);toast(k+' assigned');break;
case'esc':A1.esc='Escalated to DG';A1.log.push('Escalated to DG');toast(k+' escalated');break;
case'res':{const v=document.getElementById('ev').value.trim();if(!v){toast('Add closure evidence before resolving');return}A1.st='Resolved';A1.ev=v;A1.log.push('Resolved with evidence');toast(k+' resolved');break}
case'sev':st.sev=k;break;case'tab':st.tab=k;break;case'role':st.role=k;st.pm=false;if(!ACC[k].includes(st.screen))st.screen='overview';toast('Viewing as '+ROLES[k]);break;
case'logout':vmrLive.disconnect();st=Object.assign(st,{screen:'login',pm:false,nt:false});break;
case'vmrrefresh':void vmrLive.refresh();return;
case'sync':{const s=SYS.find(x=>x[0]==k);s[2]='Healthy';s[3]='22 Nov '+new Date().toTimeString().slice(0,5);s[4]='0 min';s[5]=0;toast(k+' synchronized');break}
case'exp':toast('Aggregate report export queued (sample)');return;case'acct':toast('Account settings open here (prototype)');st.pm=false;break;case'forgot':toast('Password reset link sent to your CIABOC email (sample)');return;
case'sort':{const x=T[k];x.d=x.s==+i?-x.d:1;x.s=+i;document.getElementById('tb_'+k).innerHTML=tb(k);return}
case'pp':{T[k].p=Math.max(0,T[k].p+ +i);document.getElementById('tb_'+k).innerHTML=tb(k);return}
default:return}render()}
document.addEventListener('click',e=>{if(e.target.closest('[data-a="forgot"]'))e.preventDefault();const el=e.target.closest('[data-a]');
if(!el){if((st.nt||st.pm)&&!e.target.closest('.pop')){st.nt=st.pm=false;render()}return}
if(el.dataset.a=='stay'||(el.dataset.a=='close'&&e.target.closest('.md')&&!e.target.closest('button')))return;
if(['q','gs','per','lang','div','urole','cmp'].includes(el.dataset.a)||el.tagName=='SELECT'||el.tagName=='INPUT')return;act(el.dataset.a,el.dataset.k,el.dataset.i)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.a=='q'){T[el.dataset.k].q=el.value;T[el.dataset.k].p=0;document.getElementById('tb_'+el.dataset.k).innerHTML=tb(el.dataset.k)}});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.a;if(!a)return;
if(a=='per')st.n=+el.value;else if(a=='lang'){st.lang=el.value;toast({en:'Language: English',si:'භාෂාව: සිංහල',ta:'மொழி: தமிழ்'}[st.lang])}else if(a=='div')st.div=el.value;else if(a=='cmp')st.cmp=el.checked;
else if(a=='urole'){U[+el.dataset.k][1]=el.value;toast('Role updated and logged in audit trail')}else return;
if(st.screen==='vmr'&&(a==='per'||a==='cmp'))vmrLive.mount(document.getElementById('vmr-live'),{months:st.n,compare:st.cmp});
else render()});
render();
</script></body></html>
