spring.application.name=CIABOC-Dashboard

server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/ciaboc_dashboard}
spring.datasource.username=${DB_USERNAME:ciaboc}
spring.datasource.password=${DB_PASSWORD:ciaboc}
spring.datasource.driver-class-name=org.postgresql.Driver

dashboard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
dashboard.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:3000/login}

dashboard.vmr.atlas.uri=${VMR_ATLAS_URI:}
dashboard.vmr.atlas.database=${VMR_ATLAS_DATABASE:ciaboc_rvm}
dashboard.vmr.atlas.visits=${VMR_ATLAS_VISITS_COLLECTION:visit}
dashboard.vmr.atlas.movements=${VMR_ATLAS_MOVEMENTS_COLLECTION:vehicle_movement}
logging.level.org.mongodb.driver=WARN

dashboard.local-auth.enabled=${LOCAL_AUTH_ENABLED:true}
dashboard.local-auth.email=${LOCAL_AUTH_EMAIL:admin@ciaboc.local}
dashboard.local-auth.password=${LOCAL_AUTH_PASSWORD:ChangeMe123!}

management.endpoints.web.exposure.include=health,info

dashboard.pin.max-attempts=${PIN_MAX_ATTEMPTS:5}
dashboard.pin.lock-duration-minutes=${PIN_LOCK_DURATION_MINUTES:15}
dashboard.pin.rate-limit-per-minute=${PIN_RATE_LIMIT_PER_MINUTE:10}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
