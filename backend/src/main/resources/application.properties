spring.application.name=CIABOC-Dashboard

server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ciaboc_dashboard}
spring.datasource.username=${DB_USERNAME:ciaboc}
spring.datasource.password=${DB_PASSWORD:ciaboc}
spring.datasource.driver-class-name=org.postgresql.Driver

dashboard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info

dashboard.pin.max-attempts=${PIN_MAX_ATTEMPTS:5}
dashboard.pin.lock-duration-minutes=${PIN_LOCK_DURATION_MINUTES:15}
dashboard.pin.rate-limit-per-minute=${PIN_RATE_LIMIT_PER_MINUTE:10}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
