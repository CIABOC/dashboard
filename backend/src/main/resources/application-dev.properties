# ===== Dev Profile =====
# In-memory H2 database (no PostgreSQL required)
spring.datasource.url=jdbc:h2:mem:ciaboc_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=true

# Disable OAuth2 auto-config (no SSO provider needed for dev)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

dashboard.dev-mode=true
